  // Moon altitude (low-precision, good to a few minutes for rise/set)
  function moonAlt(ms, lat, lon) {
    const n = ms / 864e5 + 2440587.5 - 2451545.0;
    const Lm = (218.316 + 13.176396 * n) * RAD, Mm = (134.963 + 13.064993 * n) * RAD, F = (93.272 + 13.229350 * n) * RAD;
    const lonE = Lm + 6.289 * RAD * Math.sin(Mm), latE = 5.128 * RAD * Math.sin(F), eps = 23.439 * RAD;
    const ra = Math.atan2(Math.sin(lonE) * Math.cos(eps) - Math.tan(latE) * Math.sin(eps), Math.cos(lonE));
    const dec = Math.asin(Math.sin(latE) * Math.cos(eps) + Math.cos(latE) * Math.sin(eps) * Math.sin(lonE));
    const H = (280.46061837 + 360.98564736629 * n) * RAD + lon * RAD - ra;
    const s = Math.sin(lat * RAD) * Math.sin(dec) + Math.cos(lat * RAD) * Math.cos(dec) * Math.cos(H);
    return Math.asin(Math.max(-1, Math.min(1, s))) / RAD;
  }

  let moonCache = { key: null, v: null };
  function moonTimes(d) {
    const key = (d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate()) + '|' + loc.lat.toFixed(2) + '|' + loc.lon.toFixed(2);
    if (moonCache.key === key) return moonCache.v;
    const t0 = tzSel < 0 ? new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime()
                         : Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - offsetAt(curReal.getTime());
    let rise = null, set = null, prev = moonAlt(t0, loc.lat, loc.lon) - 0.125;
    for (let i = 1; i <= 288; i++) {
      const a = moonAlt(t0 + i * 300000, loc.lat, loc.lon) - 0.125;
      if (prev < 0 && a >= 0 && rise === null) rise = (i - 1 + (-prev / (a - prev))) * 5;
      if (prev >= 0 && a < 0 && set === null) set = (i - 1 + (prev / (prev - a))) * 5;
      prev = a;
    }
    moonCache = { key, v: { rise, set } };
    return moonCache.v;
  }

  let twCache = { key: null, v: null };
  function twilight(d) {
    const key = (d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate()) + '|' + loc.lat.toFixed(2) + '|' + loc.lon.toFixed(2);
    if (twCache.key !== key) twCache = { key, v: { civ: sunTimes(d, loc.lat, loc.lon, -6), ast: sunTimes(d, loc.lat, loc.lon, -18) } };
    return twCache.v;
  }

  // Live weather from Open-Meteo (free, no key). Refreshed every 15 minutes while the panel is visible.
  const wx = { data: null, aq: null, key: '', next: 0, busy: false, err: false };
  let wxMinKey = -1;

  function fetchWx() {
    const key = loc.lat.toFixed(2) + ',' + loc.lon.toFixed(2);
    if (wx.busy === key || (wx.key === key && Date.now() < wx.next)) return;
    wx.busy = key;
    const q = 'latitude=' + loc.lat.toFixed(3) + '&longitude=' + loc.lon.toFixed(3);
    const u1 = 'https://api.open-meteo.com/v1/forecast?' + q +
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,pressure_msl,cloud_cover,visibility,wind_speed_10m,wind_gusts_10m,wind_direction_10m,precipitation,uv_index' +
      '&daily=uv_index_max,precipitation_probability_max&timezone=auto&wind_speed_unit=kmh';
    const u2 = 'https://air-quality-api.open-meteo.com/v1/air-quality?' + q + '&current=european_aqi,pm2_5,pm10';
    Promise.all([
      fetch(u1).then(r => { if (!r.ok) throw 0; return r.json(); }),
      fetch(u2).then(r => r.ok ? r.json() : null).catch(() => null)
    ]).then(([a, b]) => {
      if (wx.busy !== key) return;            // another city was picked meanwhile
      wx.data = a; wx.aq = b; wx.key = key; wx.err = false; wx.busy = false; wx.next = Date.now() + 900000;
      renderWx();
    }).catch(() => {
      if (wx.busy !== key) return;
      wx.err = true; wx.busy = false; wx.key = key; wx.next = Date.now() + 60000;
      renderWx();
    });
  }

  function wxTick() {
    const k = Math.floor(Date.now() / 60000);
    if (k === wxMinKey) return;
    wxMinKey = k;
    fetchWx();
    renderWx();
  }

  function renderWx() {
    const el = document.getElementById('wx');
    if (!el) return;
    const T = WXT[lang], d = curDate, dr = curReal;
    const w = wx.data && wx.data.current, dl = wx.data && wx.data.daily, aq = wx.aq && wx.aq.current;
    const D = '—';
    const ICON = {
      cloud: '<path d="M4.5 12.5h7a3 3 0 0 0 .4-6A4 4 0 0 0 4.3 7.4 2.6 2.6 0 0 0 4.5 12.5z"/>',
      rain: '<path d="M4 9h7.5a2.5 2.5 0 0 0 .3-5 3.5 3.5 0 0 0-6.7.8A2.4 2.4 0 0 0 4 9z"/><path d="M5 11.5l-.8 2M8 11.5l-.8 2M11 11.5l-.8 2"/>',
      sun: '<circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>',
      moon: '<path d="M12.5 9.5A5.5 5.5 0 0 1 6.5 3.5a5.5 5.5 0 1 0 6 6z"/>'
    };
    const ic = n => '<svg class="wx-i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[n] + '</svg>';
    const chip = (name, text, tip) => '<span class="wx-c" title="' + tip + '">' + ic(name) + text + '</span>';
    const num = (v, dig, u) => (v === null || v === undefined || isNaN(v)) ? D : (+v).toFixed(dig) + u;
    const tm = (o, k) => (!o || o.polar || o[k] === null || o[k] === undefined) ? D : fmtMin(o[k]);

    const sunUp = sunAlt(dr, loc.lat, loc.lon) > -0.833;
    let sky = sunUp ? 'sun' : 'moon';
    if (w && w.precipitation > 0.05) sky = 'rain';
    else if (w && w.cloud_cover >= 70) sky = 'cloud';
    const temp = w ? Math.round(w.temperature_2m) + '°' : D;
    const cloud = w ? chip('cloud', num(w.cloud_cover, 0, '%'), T.cloud) : '';
    const status = w ? '' : (wx.err ? T.offline : T.loading);

    // small header, shown with every clock model: sky symbol, temperature, cloud cover
    document.getElementById('wxIc').innerHTML = ic(sky);
    document.getElementById('wxTemp').textContent = temp;
    document.getElementById('wxSub').innerHTML = w ? cloud : '';

    if (model !== 'weather') return;

    // weather model: everything listed on its own line
    document.getElementById('wxpPlace').textContent = tzSel >= 0 ? I18N[lang].cities[tzSel] : (loc.gps ? I18N[lang].yourLoc : I18N[lang].locDefault);
    document.getElementById('wxpIc').innerHTML = ic(sky);
    document.getElementById('wxpTemp').textContent = temp;
    document.getElementById('wxpCl').innerHTML = w ? cloud : '<span class="wx-sub">' + status + '</span>';

    const st = sunInfo(d), tw = twilight(d), mt = moonTimes(d);
    const p = moonPhase(dr), k = (1 - Math.cos(2 * Math.PI * p)) / 2;
    const moonUp = moonAlt(dr.getTime(), loc.lat, loc.lon) > 0.125;
    const row = (a, b) => '<div class="wx-r"><span>' + a + '</span><b>' + b + '</b></div>';
    const sec = (t, rows) => '<div class="wx-sec"><div class="wx-t">' + t + '</div>' + rows.join('') + '</div>';
    const visF = w && w.visibility != null ? (w.visibility >= 10000 ? Math.round(w.visibility / 1000) : (w.visibility / 1000).toFixed(1)) + ' km' : D;
    const dirF = w && w.wind_direction_10m != null ? ' ' + T.compass[Math.round(w.wind_direction_10m / 45) % 8] : '';
    const popF = dl && dl.precipitation_probability_max ? dl.precipitation_probability_max[0] : null;
    const uvN = w ? w.uv_index : null, uvM = dl && dl.uv_index_max ? dl.uv_index_max[0] : null;
    const uvLvl = u => u === null || u === undefined ? D : T.uvL[u < 3 ? 0 : u < 6 ? 1 : u < 8 ? 2 : u < 11 ? 3 : 4];
    const r1f = v => Math.round(v * 10) / 10;
    const aqv = aq ? aq.european_aqi : null;
    const aqT = aqv == null ? D : T.aqL[aqv <= 20 ? 0 : aqv <= 40 ? 1 : aqv <= 60 ? 2 : aqv <= 80 ? 3 : aqv <= 100 ? 4 : 5];
    let sgF = D;
    if (sunUp) sgF = T.sgDay;
    else {
      const sc = (w ? w.cloud_cover : 0) * 0.6 + (moonUp ? k * 100 * 0.4 : 0);
      sgF = T.sg[sc <= 15 ? 0 : sc <= 35 ? 1 : sc <= 60 ? 2 : 3];
    }
    document.getElementById('wxFull').innerHTML = [
      sec(T.humP, [row(T.hum, w ? num(w.relative_humidity_2m, 0, '%') : D), row(T.pres, w ? num(w.pressure_msl, 0, ' hPa') : D)]),
      sec(T.cloudV, [row(T.cloud, w ? num(w.cloud_cover, 0, '%') : D), row(T.vis, visF)]),
      sec(T.windR, [row(T.wind, w ? num(w.wind_speed_10m, 0, ' km/h') + dirF : D), row(T.gust, w ? num(w.wind_gusts_10m, 0, ' km/h') : D),
                    row(T.rain, w ? num(w.precipitation, 1, ' mm') : D), row(T.chance, num(popF, 0, '%'))]),
      sec(T.sunT, [row(T.rise, tm(st, 'rise')), row(T.set, tm(st, 'set')),
                   row(T.cDawn, tm(tw.civ, 'rise')), row(T.cDusk, tm(tw.civ, 'set')),
                   row(T.aDawn, tm(tw.ast, 'rise')), row(T.aDusk, tm(tw.ast, 'set'))]),
      sec(T.moonN, [row(I18N[lang].moonNames[Math.floor(p * 8 + 0.5) % 8], Math.round(k * 100) + '%'),
                    row(T.mRise, mt.rise === null ? D : fmtMin(mt.rise)), row(T.mSet, mt.set === null ? D : fmtMin(mt.set)),
                    row(T.stars, sgF)]),
      sec(T.uvT, [row(T.uvNow, uvN == null ? D : r1f(uvN) + ' · ' + uvLvl(uvN)), row(T.uvMax, uvM == null ? D : r1f(uvM) + ' · ' + uvLvl(uvM))]),
      sec(T.aqT, [row(T.aqi, aqv == null ? D : Math.round(aqv) + ' · ' + aqT), row('PM2.5', aq ? num(aq.pm2_5, 0, ' µg') : D), row('PM10', aq ? num(aq.pm10, 0, ' µg') : D)])
    ].join('');
  }

  // ask for the position on the first tap anywhere (browsers only allow it after a gesture)
  window.addEventListener('pointerdown', ensureLocation, { once: true, passive: true });

  /* ---------- World clock row (follows the virtual clock: speed, back, reset) ---------- */
  const CITIES = [
    ['Madrid', 'Europe/Madrid'], ['London', 'Europe/London'], ['New York', 'America/New_York'],
    ['Buenos Aires', 'America/Argentina/Buenos_Aires'], ['Tokyo', 'Asia/Tokyo'], ['Sydney', 'Australia/Sydney']
  ];
  const worldEl = document.getElementById('world');
  const btnWorld = document.getElementById('btnWorld');
  let worldOn = true;
  let lastWorldKey = -1;
  let worldFmt = [];
  const worldCells = [];
  try { worldOn = localStorage.getItem('braunWorld') !== 'off'; } catch (e) {}
  try {
    worldFmt = CITIES.map(c => new Intl.DateTimeFormat('en-GB', {
      timeZone: c[1], hourCycle: 'h23', hour: '2-digit', minute: '2-digit',
      year: 'numeric', month: 'numeric', day: 'numeric'
    }));
    CITIES.forEach((c, ci) => {
      const el = document.createElement('div');
      el.className = 'wc';
      el.innerHTML = '<div class="wc-city"></div><div class="wc-time"></div><div class="wc-day"></div><i class="wc-dot"></i>';
      el.children[0].textContent = c[0];
      el.children[0].dataset.code = ({ 'New York': 'NYC', 'Buenos Aires': 'BUE', 'Tokyo': 'TYO' })[c[0]] || c[0].slice(0, 3).toUpperCase();
      document.getElementById(ci < 3 ? 'worldL' : 'worldR').appendChild(el);   // 3 cities per side
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-pressed', 'false');
      el.addEventListener('click', () => selectCity(ci));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectCity(ci); } });
      worldCells.push({ el, name: el.children[0], time: el.children[1], day: el.children[2], dot: el.children[3] });
    });
  } catch (e) { worldFmt = []; btnWorld.hidden = true; worldEl.hidden = true; }

  function syncWorld() {
    btnWorld.textContent = worldOn ? t('worldOn') : t('worldOff');
    btnWorld.classList.toggle('active', worldOn);
    btnWorld.setAttribute('aria-pressed', worldOn ? 'true' : 'false');
    if (worldFmt.length) worldEl.hidden = !worldOn;
  }

  /* ----- Pick a world city: the main clock, date and weather switch to it (tap it again to go back) ----- */
  function selectCity(i) {
    tzSel = (i === tzSel) ? -1 : i;
    tzFmt = tzSel < 0 ? null : new Intl.DateTimeFormat('en-GB', {
      timeZone: CITIES[tzSel][1], hourCycle: 'h23',
      year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric'
    });
    loc = tzSel < 0 ? homeLoc : { lat: CITY_LL[tzSel][0], lon: CITY_LL[tzSel][1], gps: false };
    sunCache = { key: null, v: null }; moonCache = { key: null, v: null }; twCache = { key: null, v: null };
    wx.data = null; wx.aq = null; wx.err = false; wx.key = ''; wx.next = 0;
    lastDateKey = ''; lastWorldKey = -1; lastBucket = null; lastSpeak = null; lastBug = null;
    worldCells.forEach((c, k) => {
      c.el.classList.toggle('sel', k === tzSel);
      c.el.setAttribute('aria-pressed', k === tzSel ? 'true' : 'false');
    });
    fetchWx();
    renderWx();
  }

  function updateWorld(real, d) {
    if (!worldOn || !worldFmt.length) return;
    const k = Math.floor(virtualTime / 1000);
    if (k === lastWorldKey) return;
    lastWorldKey = k;
    const base = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());     // day labels are relative to the shown clock
    worldFmt.forEach((f, i) => {
      const p = {};
      f.formatToParts(real).forEach(x => { p[x.type] = x.value; });
      const diff = Math.round((Date.UTC(+p.year, +p.month - 1, +p.day) - base) / 864e5);
      const tm = p.hour + ':' + p.minute;
      const lbl = diff > 0 ? '+' + diff + ' ' + t('dayWord') : diff < 0 ? '\u2212' + Math.abs(diff) + ' ' + t('dayWord') : '';
      const c = worldCells[i];
      if (c.time.textContent !== tm) c.time.textContent = tm;
      if (c.day.textContent !== lbl) c.day.textContent = lbl;
      const alt = sunAlt(real, CITY_LL[i][0], CITY_LL[i][1]);
      const dc = alt > -0.833 ? 'wc-dot day' : alt > -6 ? 'wc-dot twi' : 'wc-dot';
      if (c.dot.className !== dc) c.dot.className = dc;
    });
  }

  btnWorld.addEventListener('click', () => {
    worldOn = !worldOn;
    lastWorldKey = -1;
    try { localStorage.setItem('braunWorld', worldOn ? 'on' : 'off'); } catch (e) {}
    syncWorld();
  });
  syncWorld();

  /* ----- Pendulum / metronome: swings once per 2 s, ticks on every second at the extremes ----- */
  let tickOn = true;
  let lastTickSec = null;
  let tickFlash = null;
  try { tickOn = localStorage.getItem('braunTick') !== 'off'; } catch (e) {}

  function syncTickBtn() {
    const tb = document.getElementById('btnTick');
    if (!tb) return;
    tb.textContent = tickOn ? t('tickOn') : t('tickOff');
    tb.classList.toggle('active', tickOn);
  }

  // Soft wooden click; "tick" and "tock" differ slightly in pitch
  function playTick(side) {
    if (bugleBusy || !audioCtx || audioCtx.state !== 'running') return;
    const t0 = audioCtx.currentTime + 0.005;
    const f = side > 0 ? 1500 : 1050;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(f, t0);
    o.frequency.exponentialRampToValueAtTime(f * 0.55, t0 + 0.05);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.07);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + 0.09);
  }

  // Fires when the (virtual) clock crosses a whole second; only at normal-ish speed
  function checkTick(dt) {
    const sec = Math.floor(virtualTime / 1000);
    const prev = lastTickSec;
    lastTickSec = sec;
    if (prev === null || prev === sec || model !== 'pendulum') return;
    if (Math.abs(speed) > 2 || dt > 1500 || Math.abs(sec - prev) > 2) return;
    const side = ((sec % 2) + 2) % 2 === 0 ? 1 : -1;     // cos(pi*t) is +1 on even seconds
    tickFlash = { t0: frameNow, side };
    if (tickOn) playTick(side);
  }

  function paintPendulum() {
    drawPlaque();
    const A = 24 * Math.PI / 180, L = 178, px = cx, py = 34;
    // Normal speed: locked to the clock's seconds. Fast-forward: swing at a steady pace instead of a blur
    const tt = Math.abs(speed) <= 2 ? virtualTime / 1000 : frameNow / 1000;
    const th = A * Math.cos(Math.PI * tt);

    // arc guide and centre mark
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = rgba(0.12);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(px, py, L, Math.PI / 2 - A - 0.1, Math.PI / 2 + A + 0.1);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px, py + L - 12);
    ctx.lineTo(px, py + L + 12);
    ctx.stroke();

    // extreme markers; the one just reached flashes with the tick
    [-1, 1].forEach(s => {
      const a = s * A;
      let k = 0;
      if (tickFlash && tickFlash.side === s) k = Math.max(0, 1 - (frameNow - tickFlash.t0) / 260);
      ctx.beginPath();
      ctx.moveTo(px + Math.sin(a) * (L - 15), py + Math.cos(a) * (L - 15));
      ctx.lineTo(px + Math.sin(a) * (L + 15), py + Math.cos(a) * (L + 15));
      ctx.strokeStyle = k > 0 ? FLUOR : rgba(0.3);
      ctx.lineWidth = k > 0 ? 2.5 : 1.5;
      if (k > 0) { ctx.shadowColor = FLUOR; ctx.shadowBlur = 14 * k; }
      ctx.stroke();
      ctx.shadowBlur = 0;
    });
    ctx.restore();

    // rod and bob
    const bx = px + Math.sin(th) * L, by = py + Math.cos(th) * L;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(bx, by);
    ctx.strokeStyle = FLUOR;
    ctx.lineWidth = 2;
    ctx.shadowColor = FLUOR;
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(bx, by, 17, 0, Math.PI * 2);
    ctx.fillStyle = rgba(0.16);
    ctx.fill();
    ctx.shadowColor = FLUOR;
    ctx.shadowBlur = 10;
    ctx.strokeStyle = FLUOR;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(bx, by, 5, 0, Math.PI * 2);
    ctx.fillStyle = FLUOR;
    ctx.fill();
    // pivot
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // small time under the swing
    const d = curDate;
    ctx.fillStyle = rgba(0.85);
    ctx.font = `300 20px ${SANS}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pad(d.getHours()) + ':' + pad(d.getMinutes()), cx, 268);
  }

  document.getElementById('btnTick').addEventListener('click', () => {
    unlockAudio();
    tickOn = !tickOn;
    try { localStorage.setItem('braunTick', tickOn ? 'on' : 'off'); } catch (e) {}
    syncTickBtn();
  });

  // Model buttons
  document.querySelectorAll('.model-btn').forEach(b =>
    b.addEventListener('click', () => { setModel(b.dataset.model); if (b.dataset.model === 'sun' || b.dataset.model === 'weather') ensureLocation(); }));
  let prevModel = 'analog';
  document.getElementById('btnWx').addEventListener('click', e => {

  try { savedModel = localStorage.getItem('braunClockModel') || 'analog'; } catch (e) {}

  /* ---------- Cuckoo: every hour (one call per hour) and once on the half-hour ---------- */
  const cuckooEl = document.getElementById('cuckoo');
  const soundBtn = document.getElementById('cuckooSound');
  let cuckooBusy = false;
  let lastBucket = null;        // { key, h, half } of the half-hour slot the clock is in
  let pendingChime = null;      // scheduled chime that had to wait for a bugle call: { h, half, at }
  let lastVT = null;
  let cuckooOn = true;          // off = no sound and the bird stays inside
  let cuckooTimers = [];
  let audioCtx = null, master = null;
  let CALL_GAP = 1000;       // ms between calls
  let chimeType = 'cuckoo';  // cuckoo | westminster | bell | tick
  let chimeVol = 75;         // 0-100, also used for the spoken time

  const chimeDd = document.getElementById('chimeDd');
  const chimeMenu = document.getElementById('chimeMenu');
  const chimeOpts = chimeMenu.querySelectorAll('[data-chime]');
  const volSlider = document.getElementById('volSlider');
  const volNum = document.getElementById('volNum');

    const ct = localStorage.getItem('braunChime');

    const cv = parseInt(localStorage.getItem('braunVol'), 10);

  } catch (e) {}

  volNum.textContent = chimeVol;

  function syncSoundBtn() {
    soundBtn.textContent = cuckooOn ? t('ch_' + chimeType) : t('chOff');

  // Master volume: gentle curve so the low end of the slider is still usable

    master.connect(audioCtx.destination);

  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let kaEl = null, kaPaused = false, kaGesture = false;

  function silentWavUrl() {
    const rate = 8000, n = rate;                  // 1 second, mono, 16-bit
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, n * 2, true);

    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  function kaWanted() {
    return IS_IOS && !kaPaused && !arActive && (cuckooOn || speakOn || bugleOn || (tickOn && model === 'pendulum'));
  }
  function kaStart() {

          navigator.mediaSession.setActionHandler('play', () => { kaPaused = false; kaEl.play().catch(() => {}); });
          navigator.mediaSession.setActionHandler('pause', () => { kaPaused = true; kaEl.pause(); });
        }
      }
      if (kaEl.paused) kaEl.play().catch(() => {});
    } catch (e) {}
  }
  function kaTick() {
    if (!kaGesture) return;

  }

  ['touchend', 'pointerup', 'click', 'keydown'].forEach(ev => window.addEventListener(ev, () => {

  });

  // One "cuck-oo": a falling minor third, soft sine with a little overtone
  function playCuckooCall() {
    if (!cuckooOn || !audioCtx || audioCtx.state !== 'running') return;
    const t = audioCtx.currentTime + 0.02;
    const note = (f0, f1, start, dur) => {
      [[1, 0.5], [2, 0.12]].forEach(([mul, vol]) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(f0 * mul, t + start);
        o.frequency.exponentialRampToValueAtTime(f1 * mul, t + start + dur);
        g.gain.setValueAtTime(0.0001, t + start);
        g.gain.exponentialRampToValueAtTime(vol, t + start + 0.025);
        g.gain.setValueAtTime(vol, t + start + dur * 0.55);
        g.gain.exponentialRampToValueAtTime(0.0001, t + start + dur);
        o.connect(g); g.connect(master);
        o.start(t + start); o.stop(t + start + dur + 0.05);
      });
    };
    note(884, 872, 0, 0.2);        // cuck
    note(742, 730, 0.26, 0.36);    // -oo
  }

  function later(fn, ms) { cuckooTimers.push(wsetTimeout(fn, ms)); }

  function singCall() {
    playCuckooCall();
    cuckooEl.classList.add('calling', 'open');
    later(() => cuckooEl.classList.remove('open'), 200);
    later(() => cuckooEl.classList.add('open'), 260);
    later(() => cuckooEl.classList.remove('open'), 620);
  }

  function runCuckoo(count) {
    if (!cuckooOn || cuckooBusy || bugleBusy) return;
    cuckooBusy = true;
    CALL_GAP = speed > 8 ? 700 : 1000;                    // quicker calls when time is racing
    cuckooEl.classList.add('ajar');                       // doors open
    later(() => cuckooEl.classList.add('out'), 300);      // bird pops out
    for (let i = 0; i < count; i++) later(singCall, 800 + i * CALL_GAP);
    later(() => {
      cuckooEl.classList.remove('calling', 'open');
      cuckooEl.classList.remove('out');                   // bird goes back in
      later(() => { cuckooEl.classList.remove('ajar'); cuckooBusy = false; }, 600);
    }, 800 + (count - 1) * CALL_GAP + 900);
  }

  // Switching off mid-call: stop everything and tuck the bird away at once
  function cancelCuckoo() {
    cuckooTimers.forEach(id => wclearTimeout(id));
    cuckooTimers = [];
    cuckooEl.classList.remove('calling', 'open', 'out', 'ring');
    setTimeout(() => cuckooEl.classList.remove('ajar'), 450);
    cuckooBusy = false;
    resetMaster();                       // also silences any chime notes already scheduled
  }

  /* ----- Other chimes: Westminster, soft bell, mechanical tick ----- */
  // A bell strike: a few inharmonic partials with a long soft decay
  function bellNote(t0, f, vol, dec) {
    [[1, 1], [2, 0.45], [2.76, 0.3], [5.4, 0.12]].forEach(([m, a], i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = f * m;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol * a, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec / (1 + i * 0.6));
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dec + 0.1);
    });
  }

  // Escapement-style click: two quick taps
  function mechClick(t0, f) {
    [0, 0.07].forEach((dly, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const ff = i ? f * 0.72 : f;
      o.type = 'triangle';
      o.frequency.setValueAtTime(ff, t0 + dly);
      o.frequency.exponentialRampToValueAtTime(ff * 0.5, t0 + dly + 0.05);
      g.gain.setValueAtTime(0.0001, t0 + dly);
      g.gain.exponentialRampToValueAtTime(i ? 0.18 : 0.3, t0 + dly + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dly + 0.06);
      o.connect(g); g.connect(master);
      o.start(t0 + dly); o.stop(t0 + dly + 0.08);
    });
  }

  // Westminster-style phrases (G#4 F#4 E4 B3 family) and the low hour bell
  const WM = { 1: [415.3, 370, 329.6, 246.9], 2: [329.6, 370 * 0 + 415.3, 370, 246.9],
               3: [329.6, 370, 415.3, 329.6], 4: [415.3, 329.6, 370, 246.9], 5: [246.9, 370, 415.3, 329.6] };
  const WM_BONG = 164.8;

  function ringPulse() {
    cuckooEl.classList.add('ring');
    later(() => cuckooEl.classList.remove('ring'), 170);
  }

  function runChime(h, half, sched) {
    // A chime that is due while a bugle call is playing (or queued) is not lost: the bugle keeps
    // priority and the chosen sound (cuckoo, Westminster, bell, tick) follows right after it.
    if (sched && cuckooOn && bugleActive() && speed <= 8) { pendingChime = { h, half, at: Date.now() }; return; }
    if (chimeType === 'cuckoo') { runCuckoo(half ? 1 : (h % 12 || 12)); return; }
    if (!cuckooOn || cuckooBusy || bugleBusy) return;
    cuckooBusy = true;
    const n = half ? 1 : (h % 12 || 12);
    const fast = speed > 8;                       // quicker when time is racing
    const ev = [];                                // [seconds from now, play(time)]
    let dur = 0;
    if (chimeType === 'bell') {
      const gap = fast ? 0.7 : 1.3;
      for (let i = 0; i < n; i++) ev.push([i * gap, tt => bellNote(tt, 660, 0.26, 2.4)]);
      dur = (n - 1) * gap + 2.4;
    } else if (chimeType === 'tick') {
      const gap = fast ? 0.35 : 0.55;
      for (let i = 0; i < n; i++) ev.push([i * gap, tt => mechClick(tt, 1250)]);
      dur = (n - 1) * gap + 0.3;
    } else {                                      // westminster
      const note = fast ? 0.42 : 0.62;
      const phrases = half ? [2, 3] : [4, 5, 1, 2];
      let at = 0;
      phrases.forEach(p => {
        WM[p].forEach(f => { ev.push([at, tt => bellNote(tt, f, 0.3, 2.2)]); at += note; });
        at += note * 0.8;
      });
      at += 0.4;
      const gap = fast ? 0.9 : 1.7;
      for (let i = 0; i < n; i++) ev.push([at + i * gap, tt => bellNote(tt, WM_BONG, 0.5, 3.4)]);
      dur = at + (n - 1) * gap + 3.2;
    }
    const base = audioCtx && audioCtx.state === 'running' ? audioCtx.currentTime + 0.05 : null;
    ev.forEach(([s, fn]) => {
      if (base !== null) fn(base + s);
      later(ringPulse, s * 1000);
    });

  }

  // One short sample so the person hears what they just picked or the new volume
  function previewSound() {
    if (!cuckooOn || bugleBusy || !audioCtx || audioCtx.state !== 'running') return;

  // Watches the (virtual) clock and fires when it crosses :00 or :30

    const half = d.getMinutes() >= 30 ? 1 : 0;
    const key = (d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate()) * 100 + d.getHours() * 2 + half;
    const cur = { key, h: d.getHours(), half };
    const prev = lastBucket;
    lastBucket = cur;
    const step = Math.abs(virtualTime - lastVT);
    const jumped = lastVT !== null && step > dt * speed + 1500;   // Reset / manual time change
    lastVT = virtualTime;
    if (!prev || prev.key === key || jumped) return;
    // Works at any speed now; only skip the big gap when a hidden tab wakes up again
    if (dt > 1500) return;
    // moving forward the boundary we crossed starts the new slot; in reverse it starts the old one
    const hit = direction > 0 ? cur : prev;
    runChime(hit.h, hit.half, true);

  cuckooEl.addEventListener('click', () => { unlockAudio(); runChime(12, 1); });   // tap the house for a sample (half-hour version)

  soundBtn.addEventListener('click', e => { e.stopPropagation(); unlockAudio(); openChimeMenu(chimeMenu.hidden); });
  chimeOpts.forEach(o => o.addEventListener('click', e => {
    e.stopPropagation();

    else { cuckooOn = true; chimeType = c; }

      localStorage.setItem('braunCuckoo', cuckooOn ? 'on' : 'off');
      localStorage.setItem('braunChime', chimeType);

  document.addEventListener('keydown', e => { if (e.key === 'Escape') openChimeMenu(false); });

  /* ---------- Speak the time (clock-aligned: every N minutes counted from midnight) ---------- */
  const speakDd = document.getElementById('speakDd');
  const btnSpeak = document.getElementById('btnSpeak');
  const speakMenu = document.getElementById('speakMenu');
  const speakOpts = speakMenu.querySelectorAll('.speak-opt');
  const hasVoice = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
  let speakOn = false;

  } catch (e) {}

  function syncSpeakUI() {
    btnSpeak.textContent = speakOn ? I18N[lang].speakN(speakEvery) : t('speakOff');
    btnSpeak.classList.toggle('active', speakOn);
    speakOpts.forEach(o => {

  function openSpeakMenu(open) {
    speakMenu.hidden = !open;
    btnSpeak.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function timePhrase(h, m) {
    if (lang === 'es') {
      if (m === 0 && h === 0) return 'Es medianoche.';
      if (m === 0 && h === 12) return 'Es mediodía.';
      if (model === 'word') return wordSpec(h, m).phrase + '.';
      const h12e = h % 12 || 12, art = h12e === 1 ? 'Es la ' : 'Son las ';
      const per = h < 6 ? 'de la madrugada' : h < 12 ? 'de la mañana' : h < 20 ? 'de la tarde' : 'de la noche';
      return m === 0 ? `${art}${h12e} en punto ${per}.` : `${art}${h12e} y ${m} ${per}.`;
    }
    if (m === 0 && h === 0) return "It's midnight.";
    if (m === 0 && h === 12) return "It's noon.";
    if (model === 'word') return wordSpec(h, m).phrase + '.';   // same wording as the letter grid

  function say(text) {
    if (!hasVoice || bugleBusy) return;

    } catch (e) {}

  // Wait for the cuckoo to finish its calls so the two never talk over each other
  function sayWhenFree(text, tries) {
    if (!speakOn) return;
    const n = tries || 0;
    // waits for the bugle calls first, then for the cuckoo / chime that follows them
    if ((cuckooBusy || bugleActive()) && n < 300) { wsetTimeout(() => sayWhenFree(text, n + 1), 700); return; }
    say(text);
  }

  function checkSpeak(d, dt) {
    const t = d.getHours() * 60 + d.getMinutes();
    const key = (d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate()) * 2000 + Math.floor(t / speakEvery);
    const cur = { key, t0: Math.floor(t / speakEvery) * speakEvery };
    const prev = lastSpeak;
    lastSpeak = cur;
    const step = Math.abs(virtualTime - lastSpeakVT);
    const jumped = lastSpeakVT !== null && step > dt * speed + 1500;
    lastSpeakVT = virtualTime;
    if (!speakOn || !prev || prev.key === key || jumped) return;

      // and don't wait for the cuckoo (they simply overlap)
      if (hasVoice && !speechSynthesis.speaking) say(timePhrase(d.getHours(), d.getMinutes()));
      return;
    }
    const hit = direction > 0 ? cur : prev;      // forward: the new slot starts here; reverse: the old one did
    sayWhenFree(timePhrase(Math.floor(hit.t0 / 60), hit.t0 % 60));
  }

  btnSpeak.addEventListener('click', e => { e.stopPropagation(); openSpeakMenu(speakMenu.hidden); });
  speakOpts.forEach(o => o.addEventListener('click', e => {
    e.stopPropagation();
    const m = parseInt(o.dataset.min, 10);
    const wasOn = speakOn;
    if (m === 0) {
      speakOn = false;
      if (hasVoice) { try { speechSynthesis.cancel(); } catch (err) {} }
    } else {
      speakEvery = m;
      speakOn = true;
      try { localStorage.setItem('braunSpeakEvery', String(m)); } catch (err) {}
      if (!wasOn) {                                   // tap = permission to speak + instant sample
        const d = wallOf(virtualTime);
        say(timePhrase(d.getHours(), d.getMinutes()));
      }
    }
    lastSpeak = null;
    syncSpeakUI();
    openSpeakMenu(false);
    btnSpeak.focus({ preventScroll: true });
  }));
  document.addEventListener('click', e => { if (!speakDd.contains(e.target)) openSpeakMenu(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') openSpeakMenu(false); });
  syncSpeakUI();

  /* ---------- Bugle calls: one switch, military daily schedule (synthesised, no audio files) ---------- */
  const btnBugle = document.getElementById('btnBugle');
  let bugleOn = false, bugleBusy = false, bugleTimer = null;
  let lastBug = null, lastBugVT = null;
  try { bugleOn = localStorage.getItem('braunBugle') === 'on'; } catch (e) {}
  if (!(window.AudioContext || window.webkitAudioContext)) btnBugle.hidden = true;

  // Bugle notes (open harmonics only): "NOTE:beats", R = rest
  const BF = { G3: 196, C4: 261.63, E4: 329.63, G4: 392, C5: 523.25, E5: 659.25, G5: 783.99, W1: 2349, W2: 2794 };  // W1/W2 = Scout whistle
  const BUGLE = {
    first:    { beat: 0.40, s: 'G4:.5 C5:.5 E5:.5 G5:1.5 R:.25 E5:.5 C5:.5 E5:.5 G5:2' },
    reveille: { beat: 0.34, s: 'G4:.33 G4:.33 G4:.33 C5:1 E5:.33 E5:.33 E5:.33 G5:1.5 R:.25 G5:.33 E5:.33 C5:.33 E5:.33 G5:.33 E5:.33 C5:2' },
    mess:     { beat: 0.38, s: 'G4:.25 G4:.25 C5:.5 G4:.25 G4:.25 C5:.5 E5:.25 E5:.25 G5:.5 E5:.5 C5:.5 G4:.25 C5:.25 E5:.5 C5:1.5' },
    assembly: { beat: 0.40, s: 'C5:.5 C5:.25 E5:.25 G5:1 E5:.5 C5:.5 G4:1 R:.25 C5:.5 E5:.5 G5:2' },
    work:     { beat: 0.34, s: 'G4:.3 C5:.3 E5:.3 G5:.7 E5:.3 G5:.3 C5:.5 E5:.5 G5:1.8' },
    recall:   { beat: 0.40, s: 'G4:.5 G4:.5 C5:.5 E5:1.5 R:.25 G4:.5 C5:.5 E5:.5 C5:1.8' },

  function bugleAt(m) {

    const md = (dd.getUTCMonth() + 1) * 100 + dd.getUTCDate();      // e.g. 1012 = 12 October
    let skip = null;
    for (const s of BUGLE_SPECIAL) {
      if (s.t === tm && (!s.dow || s.dow.indexOf(dd.getUTCDay()) >= 0) && (!s.date || s.date.indexOf(dd.getUTCDate()) >= 0) &&
          (!s.md || s.md.indexOf(md) >= 0)) {
        if (out.indexOf(s.name) < 0) out.push(s.name);
        if (s.replaces) skip = s.replaces;

    if (BUGLE_AT[tm] && BUGLE_AT[tm] !== skip) out.push(BUGLE_AT[tm]);

    if (st && !st.polar && Math.floor(st.set) === tm) out.push('oracion');
    return out;
  }

  function bugleNote(t0, f, dur) {
    const o = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();

    });

    lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
    flt.type = 'lowpass'; flt.frequency.value = 2300; flt.Q.value = 1.2;
    g2.gain.value = 0.35;
    const att = Math.min(0.045, dur * 0.3);
    const hold = Math.max(att + 0.005, dur - Math.min(0.07, dur * 0.3));
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.28, t0 + att);
    g.gain.setValueAtTime(0.24, t0 + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(flt); o2.connect(g2); g2.connect(flt); flt.connect(g); g.connect(master);
    [o, o2, lfo].forEach(x => { x.start(t0); x.stop(t0 + dur + 0.05); });
  }

  }

    // The bugle has priority: silence the cuckoo / chimes and any spoken time first
    cancelCuckoo();
    if (hasVoice) { try { speechSynthesis.cancel(); } catch (e) {} }
    let at = audioCtx.currentTime + 0.05;
    c.s.split(' ').forEach(tok => {

      at += dur;

    bugleBusy = true;
    wclearTimeout(bugleTimer);
    bugleTimer = wsetTimeout(() => { bugleBusy = false; resumeAfterBugle(); }, (at - audioCtx.currentTime) * 1000 + 300);
  }

  // Looks at every minute the clock crossed since the last frame, so no call is missed at any speed

    const am = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes()) / 60000);
    const prev = lastBug;
    lastBug = am;
    const step = Math.abs(virtualTime - lastBugVT);
    const jumped = lastBugVT !== null && step > dt * speed + 1500;
    lastBugVT = virtualTime;
    if (!bugleOn || prev === null || prev === am || jumped || dt > 1500) return;
    const lo = Math.min(prev, am), hi = Math.max(prev, am);
    if (hi - lo > 3000) return;
    const hits = [];
    for (let m = lo + 1; m <= hi; m++) {           // forward: minutes entered; reverse: minutes left
      bugleAt(m).forEach(n => hits.push(n));
    }
    if (direction < 0) hits.reverse();
    hits.forEach(bugleEnqueue);
  }

    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.font = "26px BraunLogo, Helvetica, Arial, sans-serif";
    g.fillStyle = `rgba(${rgb},.6)`; g.fillText(brandEl.textContent.toUpperCase(), 160, -32);
    g.font = "300 20px 'Helvetica Neue', Helvetica, Arial, sans-serif";
    g.fillStyle = `rgba(${rgb},.85)`;
    g.fillText(ck.timeTxt, 160, 366);
    g.font = "300 11px 'Helvetica Neue', Helvetica, Arial, sans-serif";
    g.fillStyle = `rgba(${rgb},.6)`; g.fillText(ck.dateTxt.toUpperCase(), 160, 395);

  }

  // Draw one textured triangle (affine map source -> destination)
  function tri(g, img, s, d) {
    const [s0, s1, s2] = s, [d0, d1, d2] = d;
    const den = (s1[0]-s0[0])*(s2[1]-s0[1]) - (s2[0]-s0[0])*(s1[1]-s0[1]);
    if (!den) return;
    const a  = ((d1[0]-d0[0])*(s2[1]-s0[1]) - (d2[0]-d0[0])*(s1[1]-s0[1])) / den;
    const b  = ((d1[1]-d0[1])*(s2[1]-s0[1]) - (d2[1]-d0[1])*(s1[1]-s0[1])) / den;
    const c  = ((s1[0]-s0[0])*(d2[0]-d0[0]) - (s2[0]-s0[0])*(d1[0]-d0[0])) / den;
    const dd = ((s1[0]-s0[0])*(d2[1]-d0[1]) - (s2[0]-s0[0])*(d1[1]-d0[1])) / den;
    const e = d0[0] - a*s0[0] - c*s0[1], f = d0[1] - b*s0[0] - dd*s0[1];
    const mx = (d0[0]+d1[0]+d2[0]) / 3, my = (d0[1]+d1[1]+d2[1]) / 3;
    g.save();
    g.beginPath();
    [d0, d1, d2].forEach((p, i) => {
      const x = mx + (p[0]-mx) * 1.04, y = my + (p[1]-my) * 1.04;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    g.closePath(); g.clip();
    g.transform(a, b, c, dd, e, f);
    g.drawImage(img, 0, 0);
    g.restore();
  }

  function capturePhoto() {
    const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    const cv = document.createElement('canvas');
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const g = cv.getContext('2d');
    g.scale(dpr, dpr);
    const vw = arVideo.videoWidth, vh = arVideo.videoHeight;
    if (vw && vh) {                         // same crop as object-fit: cover
      const k = Math.max(W / vw, H / vh);
      g.drawImage(arVideo, (W - vw*k) / 2, (H - vh*k) / 2, vw*k, vh*k);
    } else { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); }
    if (arMs.length) {
      const N = 12, SW = 540, SH = 610, X0 = -110, Y0 = -180;
      g.globalAlpha = FADES[fadeIdx];
      for (const arM of arMs) {
      const tex = buildTex(arM.k);
      const P = [];
      for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
        const lx = X0 + SW*i/N - 160, ly = Y0 + SH*j/N - 160;
        const x = arM.c0[0]*lx + arM.c1[0]*ly + arM.c3[0];
        const y = arM.c0[1]*lx + arM.c1[1]*ly + arM.c3[1];
        const z = arM.c0[2]*lx + arM.c1[2]*ly + arM.c3[2];
        const w = arF - z;
        P.push(w > 1 ? [W/2 + x*arF/w, H/2 + y*arF/w] : null);
      }
      const Tx = tex.width / N, Ty = tex.height / N;
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        const q = [P[j*(N+1)+i], P[j*(N+1)+i+1], P[(j+1)*(N+1)+i], P[(j+1)*(N+1)+i+1]];
        if (q.some(p => !p)) continue;
        const s = [[i*Tx, j*Ty], [(i+1)*Tx, j*Ty], [i*Tx, (j+1)*Ty], [(i+1)*Tx, (j+1)*Ty]];
        tri(g, tex, [s[0], s[1], s[2]], [q[0], q[1], q[2]]);
        tri(g, tex, [s[1], s[3], s[2]], [q[1], q[3], q[2]]);
      }
      }
      g.globalAlpha = 1;
    }
    // quick shutter flash
    const fl = document.createElement('div');
    fl.style.cssText = 'position:absolute;inset:0;background:#fff;opacity:.85;transition:opacity .35s;pointer-events:none';
    arEl.appendChild(fl);
    requestAnimationFrame(() => { fl.style.opacity = 0; });
    setTimeout(() => fl.remove(), 450);

    // synchronous encode so the share sheet still counts as a direct tap
    const bin = atob(cv.toDataURL('image/jpeg', 0.92).split(',')[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const file = new File([bytes], 'clock-on-my-wall.jpg', { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Braun AB 1 Clock' }).catch(() => {});
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
    }
  }
  document.getElementById('arShot').addEventListener('click', capturePhoto);

  let waBlob = null, waFile = null;
  function waPrepare() {
    if (waBlob) return;
    const bin = atob(WA_IMG.split(',')[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    waBlob = new Blob([bytes], { type: 'image/png' });
    try { waFile = new File([waBlob], 'timepro.png', { type: 'image/png' }); } catch (e) { waFile = null; }
  }
  function waToast(msg) {
    const el = document.getElementById('waToast');

  document.getElementById('btnWA').addEventListener('click', () => {

                   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (mobile && waFile && navigator.canShare && navigator.canShare({ files: [waFile] })) {
      // phones: one tap opens the share sheet with the image and the message ready
      navigator.share({ files: [waFile], text: WA_TEXT }).catch(() => {});
      return;
    }
    // desktop: open WhatsApp Web straight away with the message, image goes to the clipboard
    let copied = false;
    try {
      if (navigator.clipboard && window.ClipboardItem) {
        navigator.clipboard.write([new ClipboardItem({ 'image/png': waBlob })]).catch(() => {});
        copied = true;
      }
    } catch (e) {}
    const url = (mobile ? 'https://wa.me/?text=' : 'https://web.whatsapp.com/send?text=') + encodeURIComponent(WA_TEXT);

  });
  document.querySelectorAll('.ar-bottom .btn').forEach(b =>
    { if (b.id !== 'arColor') b.addEventListener('click', () => document.getElementById(b.dataset.for).click()); });
  arAbout.addEventListener('click', () => document.getElementById('aboutCard').click());

  /* ---------- Apply language to every label ---------- */
  const TXT_IDS = {
    btnWx: 'm_weather', btnFocus: 'focus', focusExit: 'focusShow', btnSpeed: 'speed', btnSlow: 'slow', btnReset: 'reset', btnAbout: 'about', btnColor: 'color', btnAR: 'viewAR',
    arExit: 'exit', arModel: 'model', arCity: 'city', arShot: 'photo', arCenter: 'center', arAdd: 'addClock', arDel: 'delClock', arFade: 'fade', arHint: 'hint'
  };

  /* ---------- Focus mode ---------- */
  function setFocus(on) {
    document.body.classList.toggle('focus', on);
    const b = document.getElementById('btnFocus');
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  document.getElementById('btnFocus').addEventListener('click', () => setFocus(true));
  document.getElementById('focusExit').addEventListener('click', () => setFocus(false));
  document.querySelector('.stage').addEventListener('click', () => { if (document.body.classList.contains('focus')) setFocus(false); });
  document.getElementById('brand').addEventListener('click', () => { if (document.body.classList.contains('focus')) setFocus(false); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.body.classList.contains('focus') && document.getElementById('help').hidden) setFocus(false);
  });

  /* ---------- Help overlay ---------- */
  function renderHelp() {
    const H = I18N[lang].help;
    const body = document.getElementById('helpBody');
    if (!body) return;
    document.getElementById('helpTitle').textContent = H.title;
    document.getElementById('helpClose').setAttribute('aria-label', H.close);
    document.getElementById('btnHelp').setAttribute('aria-label', H.btn);
    body.innerHTML = '';
    H.items.forEach(it => {
      const row = document.createElement('div'); row.className = 'help-i';
      const h = document.createElement('div'); h.className = 'help-h'; h.textContent = it[0];
      const p = document.createElement('div'); p.className = 'help-t';
      if (it[1].indexOf('\n') < 0) p.textContent = it[1];
      else it[1].split('\n').forEach(line => {          // "# Heading" = group title, "time|call" = one row
        const d = document.createElement('div');
        if (line.charAt(0) === '#') { d.className = 'help-sub'; d.textContent = line.slice(1).trim(); }
        else if (line.indexOf('|') > 0) {
          const k = line.split('|');
          const a = document.createElement('span'); a.className = 'help-time'; a.textContent = k[0];
          const b = document.createElement('span'); b.textContent = k.slice(1).join('|');
          d.className = 'help-line'; d.appendChild(a); d.appendChild(b);
        } else d.textContent = line;
        p.appendChild(d);
      });
      row.appendChild(h); row.appendChild(p);
      if (it[2] === 'demo') {
        const dr = document.createElement('div'); dr.className = 'help-demo-row';
        const mk = (cls, id, label, fn) => {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'btn ' + cls;
          if (id) b.id = id;
          if (label) b.setAttribute('aria-label', label);
          b.addEventListener('click', fn);
          dr.appendChild(b);
          return b;
        };
        mk('help-skip', 'bugleDemoPrev', H.prevCall, () => skipBugleDemo(-1)).textContent = '|\u25C0';
        mk('help-demo', 'bugleDemoBtn', null, toggleBugleDemo);
        mk('help-skip', 'bugleDemoNext', H.nextCall, () => skipBugleDemo(1)).textContent = '\u25B6|';
        if (p.children.length > 1) p.insertBefore(dr, p.children[1]); else row.appendChild(dr);
      }
      body.appendChild(row);
    });
    syncDemoBtn();
  }
  function openHelp(on) {
    const el = document.getElementById('help');
    el.hidden = !on;
    if (!on) stopBugleDemo();
    if (on) { renderHelp(); document.getElementById('helpBody').scrollTop = 0; document.getElementById('helpClose').focus({ preventScroll: true }); }
    else document.getElementById('btnHelp').focus({ preventScroll: true });
  }
  document.getElementById('btnHelp').addEventListener('click', e => { e.stopPropagation(); openHelp(true); });
  document.getElementById('helpClose').addEventListener('click', () => openHelp(false));
  document.getElementById('help').addEventListener('click', e => { if (e.target.id === 'help') openHelp(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('help').hidden) openHelp(false); });

  function applyLang() {
    renderHelp();
    const L = I18N[lang];
    document.documentElement.lang = lang;
    DAYS = L.days;
    MONTHS = L.months;
    lastDateKey = '';
    order = [];
    Object.keys(TXT_IDS).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.textContent = L[TXT_IDS[id]];
    });
    document.querySelectorAll('.model-btn').forEach(b => { b.textContent = L['m_' + b.dataset.model]; });
    const at = document.querySelector('.about-title');
    if (at) at.textContent = L.aboutTitle;
    btnBack.textContent = direction < 0 ? L.forward : L.back;
    document.getElementById('arLock').textContent = arLocked ? L.unlock : L.lock;
    syncSoundBtn();
    syncSpeakUI();
    syncAwakeBtn();
    syncBugleBtn();
    syncWorld();
    syncTickBtn();
    chimeOpts.forEach(o => { o.textContent = o.dataset.chime === 'off' ? L.chOff : L['ch_' + o.dataset.chime]; });
    document.getElementById('volLabel').textContent = L.volume;
    renderWx();
    volSlider.setAttribute('aria-label', L.volume);
    speakOpts[0].textContent = L.speakOff;
    cuckooEl.setAttribute('aria-label', L.cuckooAria);
    soundBtn.setAttribute('aria-label', L.cuckooToggleAria);
    btnSpeak.setAttribute('aria-label', L.speakAria);
    speakMenu.setAttribute('aria-label', L.speakMenuAria);
    worldCells.forEach((c, i) => { c.name.textContent = L.cities[i]; });
    lastWorldKey = -1;
    document.querySelectorAll('.lang-btn').forEach(b => {
      const on = b.dataset.lang === lang;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem('braunLang', lang); } catch (e) {}
    if (hasVoice) { try { speechSynthesis.cancel(); } catch (e) {} }
    hideAbout();
    applyLang();
  }));
  applyLang();

  updateStatus();
</script>
<button class="pwa-install" id="pwaInstall" type="button" hidden>Install App</button>
<div class="pwa-ios" id="pwaIos" hidden><span id="pwaIosTxt"></span><button type="button" id="pwaIosX" aria-label="Close">&times;</button></div>

<script>
/* ---------- PWA: service worker, install button, iOS helper ---------- */
(function () {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./timepro-sw.js').catch(function () {}); });
  }
  var T = {
    en: { install: 'Install App', ios: 'To install: tap Share, then \u201cAdd to Home Screen\u201d.' },
    es: { install: 'Instalar app', ios: 'Para instalar: toca Compartir y luego \u201cA\u00f1adir a pantalla de inicio\u201d.' }
  };
  var btn = document.getElementById('pwaInstall'), ios = document.getElementById('pwaIos'), iosTxt = document.getElementById('pwaIosTxt');
  var deferred = null;
  function L() { return document.documentElement.lang === 'es' ? T.es : T.en; }
  function paint() { btn.textContent = L().install; iosTxt.textContent = L().ios; }
  paint();
  new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; if (!standalone) btn.hidden = false; });
  btn.addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; btn.hidden = true; });
  });
  window.addEventListener('appinstalled', function () { btn.hidden = true; ios.hidden = true; });
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var dismissed = false; try { dismissed = sessionStorage.getItem('tpIosHint') === '1'; } catch (e) {}
  if (isIOS && !standalone && !dismissed) ios.hidden = false;
  document.getElementById('pwaIosX').addEventListener('click', function () {
    ios.hidden = true; try { sessionStorage.setItem('tpIosHint', '1'); } catch (e) {}
  });
})();
</script>
</body>
</html>
